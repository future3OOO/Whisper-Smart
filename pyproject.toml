[project]
name = "dictation-tool"
description = "Fast real-time dictation with Whisper large-v3"
authors = [{name = "Your Name"}]
license = "MIT"
requires-python = "==3.10.*"
dynamic = ["version"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "dictation_tool/__init__.py"

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "UP", "C4", "B", "A", "RUF"]
ignore = ["B008"] # opinionated: B008 Do not perform function calls in argument defaults

[tool.ruff.lint.isort]
known-first-party = ["dictation_tool"]
